<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project8 — Styles Preview</title>
  <style>
    /* Embedded (cleaned) styles from styles.css */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      color: #333;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
    }

    /* Background Image with Transparency */
    body:before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      opacity: 0.1;
      z-index: -1;
    }

    header {
      padding: 40px 0 20px;
      text-align: center;
    }

    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    p.lead { color: #555; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>Project 8</h1>
    <p class="lead">This HTML file uses an embedded, cleaned copy of `styles.css`.</p>
  </header>

  <main>
    <section>
      <h2>Preview Content</h2>
      <p>This page demonstrates the stylesheet applied inside an HTML document with <code>lang="en"</code>.</p>
    </section>
  </main>

  <footer style="margin-top:2rem;color:#666;font-size:0.9rem;">
    <p>If you prefer, I can link to the original <code>styles.css</code> instead of embedding the styles.</p>
  </footer>
</body>
</html>
